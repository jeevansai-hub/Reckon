name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Toolchain
        run: |
          flutter create . --platforms=android --project-name reckon --org com.reckon.ai
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --debug --verbose > flutter_build.log 2>&1 || true

      - name: Push Build Log to Branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B build-debug
          tail -n 200 flutter_build.log > build_error.txt
          find build/ -name "*.apk" > apk_locations.txt || true
          git add build_error.txt apk_locations.txt
          git commit -m "ci: capture build error and apk locations" || true
          git push -f origin build-debug || true

      - name: Upload APK to Release if Built
        uses: softprops/action-gh-release@v2
        if: hashFiles('build/app/outputs/flutter-apk/*.apk') != ''
        with:
          tag_name: v1.0.0
          name: Reckon App v1.0.0
          files: build/app/outputs/flutter-apk/*.apk
