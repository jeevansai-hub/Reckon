name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Generate Android Toolchain
        run: |
          flutter create . --platforms=android --project-name reckon --org com.reckon.ai
          sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' android/app/build.gradle || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test || true

      - name: Build Android APK
        run: |
          flutter build apk --debug --verbose > flutter_build.log 2>&1 || true
          cat flutter_build.log | grep -E "FAILURE|error:|Exception|Error" | head -n 30 || true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: flutter_build.log

      - name: Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reckon-companion-app-apk
          path: build/app/outputs/flutter-apk/*.apk
